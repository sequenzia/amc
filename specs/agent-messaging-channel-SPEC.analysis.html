<script type="text/markdown" id="spec-source"># Agent Messaging Channel PRD

**Version**: 1.0
**Author**: Stephen Sequenzia
**Date**: 2026-05-02
**Status**: Draft
**Spec Type**: New product
**Spec Depth**: Full technical documentation
**Description**: A single-Mac service that lets one AI agent send and receive messages on iMessage and Discord through a unified interface. The design priority is decoupling: the agent framework, the transport, and the platform connectors must each be replaceable without rewriting the others. Agents reach the system over MCP (stdio) or directly over plain HTTP. Source of truth is the blueprint at `internal/blueprints/agent-messaging-channel.md`, which this spec extends and, in two specific places, supersedes.

---

## 1. Executive Summary

The Agent Messaging Channel (AMC) is a personal-scale messaging gateway that exposes the same four-tool MCP surface (and an equivalent REST surface) over both iMessage and Discord, normalizing their very different I/O models behind a single message envelope. v1 ships as a Python+FastAPI adapter on macOS, supervised by `launchd`, with a thin TypeScript MCP wrapper for stdio-based clients (Claude Code, Claude Desktop, Codex CLI, Codex Desktop) and a documented direct-HTTP path for non-MCP consumers. The system is built decoupled-by-design so that swapping the agent framework, the MCP wrapper, or either connector requires no changes to the other layers.

## 2. Problem Statement

### 2.1 The Problem

A single owner wants one AI agent to be reachable on the messaging platforms they (and a small trusted circle) already use — iMessage and Discord — without locking the agent into either a specific platform SDK or a specific agent framework. Today, every agent framework, channel SDK, and message bus combination is a fresh integration; rewriting platform code each time the agent framework changes (or vice versa) is not a sustainable path for a personal-scale tool.

### 2.2 Current State

There is no implementation yet. The repository contains only this PRD's source (the blueprint), README, and Claude Code config. Existing reference work that AMC will build on:

- **iMessage**: `anthropics/claude-plugins-official/external_plugins/imessage` — `chat.db` polling and AppleScript send patterns.
- **Discord**: `discord.py` (and the equivalent Anthropic Discord plugin as reference, not a dependency).
- **MCP**: `@modelcontextprotocol/sdk` (TypeScript) for the wrapper.

Manual interaction with each platform — opening Messages.app, opening Discord — is the current human flow. Automation would otherwise require either a custom per-platform integration per agent framework, or coupling the agent to a single proprietary channel SDK.

### 2.3 Impact Analysis

This is a personal-tool project; "impact" is measured against the owner's experience and the architectural goals, not commercial metrics:

- **Without AMC**: every new agent framework explored (Claude Code, Claude Desktop, Codex CLI, Codex Desktop, custom Python loops) requires re-integrating either iMessage or Discord — N×M coupling.
- **With AMC**: one adapter, one MCP wrapper, two connectors. Adding a third platform (Slack, SMS, Telegram) is a single connector. Adding a third agent framework is zero adapter changes.

### 2.4 Business Value

- Validates a **decoupled three-layer architecture** as a working pattern, not a sketch.
- Produces a **portable tool** that survives churn in MCP, agent SDKs, and platform APIs.
- Yields **reusable artifacts** — the message envelope shape, the per-agent cursor schema, and the webhook delivery contract — that future projects can adopt.

## 3. Goals & Success Metrics

### 3.1 Primary Goals

1. **Receive and respond** to messages on iMessage and Discord through a single agent in v1.
2. **Decouple platform integrations from agent logic** so the agent framework can be swapped without rewriting connectors. Both MCP-aware (Claude Code, Claude Desktop, Codex CLI, Codex Desktop) and non-MCP (direct-HTTP) clients are first-class.
3. **Run entirely on one Mac**, with no external hosting dependencies for the iMessage path.
4. **Ship a documented, soak-validated v1** that a teammate could install and run without the owner present.

### 3.2 Success Metrics

[Full success-metrics table is in the spec file at lines 56-65; abbreviated here for the HTML preview. Key targets: P95 receive&lt;3s, P95 send&lt;2s, 7-day soak, 95% webhook delivery, 60-min teammate install.]

### 3.3 Non-Goals

- Multi-host / multi-Mac deployment.
- Cloud or hosted-service operation.
- iMessage group chat (post-v1).
- Reactions / tapbacks / edits / deletes (post-v1).
- HTTP MCP transport for remote agents (post-v1).
- Multi-agent leasing.
- Non-bearer auth (OAuth, mTLS).
- Production SLAs / paging / on-call.

const STATE = {
  findings: [],
  selectedId: null,
  statusFilter: 'all',
  severityFilter: 'all',
  comments: {}
};

function init() {
  STATE.findings = FINDINGS_DATA.map(f => ({
    ...f,
    status: f.status || 'pending'
  }));
  renderHeader();
  renderStats();
  renderFilters();
  renderSpec();
  renderFindings();
  updatePromptPanel();
}

function renderHeader() {
  document.getElementById('spec-name').textContent = SPEC_CONTENT.name || 'Spec Analysis';
  document.getElementById('depth-level').textContent = SPEC_CONTENT.depthLevel || '';
  document.getElementById('analyzed-at').textContent = SPEC_CONTENT.analyzedAt || '';
  document.title = `Review: ${SPEC_CONTENT.name || 'Spec Analysis'}`;
}

function renderStats() {
  const counts = { total: STATE.findings.length, critical: 0, warning: 0, suggestion: 0, pending: 0, approved: 0, rejected: 0 };
  STATE.findings.forEach(f => {
    counts[f.severity]++;
    counts[f.status]++;
  });

  const el = document.getElementById('stats');
  el.innerHTML = [
    statHTML('Total', counts.total, ''),
    statHTML('Critical', counts.critical, 'var(--purple)'),
    statHTML('Warning', counts.warning, 'var(--amber)'),
    statHTML('Suggestion', counts.suggestion, 'var(--blue)'),
    statHTML('Pending', counts.pending, 'var(--amber)'),
    statHTML('Approved', counts.approved, 'var(--green)'),
    statHTML('Rejected', counts.rejected, 'var(--red)')
  ].join('');
}

function statHTML(label, value, color) {
  const pct = STATE.findings.length ? (value / STATE.findings.length * 100) : 0;
  return `<div class="stat">
    <div class="stat-value" style="color:${color || 'var(--text)'}">${value}</div>
    <div class="stat-label">${label}</div>
    <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${color || 'var(--border)'}"></div></div>
  </div>`;
}

function renderFilters() {
  const counts = { all: STATE.findings.length, pending: 0, approved: 0, rejected: 0 };
  STATE.findings.forEach(f => counts[f.status]++);

  const tabs = [
    { key: 'all', label: 'All' },
    { key: 'pending', label: 'Pending' },
    { key: 'approved', label: 'Approved' },
    { key: 'rejected', label: 'Rejected' }
  ];

  document.getElementById('status-filters').innerHTML = tabs.map(t =>
    `<button class="filter-tab${STATE.statusFilter === t.key ? ' active' : ''}"
      onclick="setStatusFilter('${t.key}')">${t.label}<span class="count">${counts[t.key]}</span></button>`
  ).join('');
}

function renderSpec() {
  const content = SPEC_CONTENT.content || '';
  const el = document.getElementById('spec-content');
  const lines = content.split('\n');
  const findingsByLine = {};
  STATE.findings.forEach(f => {
    if (f.lineNumber) {
      if (!findingsByLine[f.lineNumber]) findingsByLine[f.lineNumber] = [];
      findingsByLine[f.lineNumber].push(f);
    }
  });

  let html = '';
  lines.forEach((line, i) => {
    const lineNum = i + 1;
    const findings = findingsByLine[lineNum];
    if (findings) {
      const f = findings[0];
      const statusClass = f.status !== 'pending' ? ` status-${f.status}` : '';
      const selectedClass = f.id === STATE.selectedId ? ' selected' : '';
      const markers = findings.map(ff =>
        `<span class="annotation-marker severity-${ff.severity}" onclick="selectFinding('${ff.id}')" title="${escapeAttr(ff.title)}">${ff.id}</span>`
      ).join('');
      html += `<div class="annotated-line severity-${f.severity}${statusClass}${selectedClass}" data-finding-id="${f.id}" onclick="selectFinding('${f.id}')">${renderMarkdownLine(line)}${markers}</div>`;
    } else {
      html += `<div>${renderMarkdownLine(line)}</div>`;
    }
  });

  el.innerHTML = html;
}

function renderFindings() {
  const filtered = STATE.findings.filter(f => {
    if (STATE.statusFilter !== 'all' && f.status !== STATE.statusFilter) return false;
    if (STATE.severityFilter !== 'all' && f.severity !== STATE.severityFilter) return false;
    return true;
  });

  const el = document.getElementById('findings-list');

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><h3>No findings match filters</h3><p>Try changing the status or severity filter.</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(f => {
    const isSelected = f.id === STATE.selectedId;
    const comment = STATE.comments[f.id] || '';
    return `
    <div class="finding-card${isSelected ? ' selected' : ''} status-${f.status}" onclick="selectFinding('${f.id}')">
      <div class="finding-header">
        <div>
          <span class="finding-id">${esc(f.id)}</span>
          <span class="badge badge-${f.severity}">${esc(f.severity)}</span>
          <span class="status-badge status-${f.status}">${esc(f.status)}</span>
        </div>
      </div>
      <div class="finding-title">${esc(f.title)}</div>
      <div class="category-badge">${esc(f.category)}</div>
      <div class="finding-location">${esc(f.location)}</div>
      <div class="finding-issue">${esc(f.issue)}</div>
      ${f.impact ? `<div class="finding-issue" style="font-style:italic">${esc(f.impact)}</div>` : ''}
      ${isSelected ? `
        ${f.currentText ? `
          <div class="finding-detail" onclick="event.stopPropagation()">
            <div class="finding-detail-label">Current</div>
            <div class="finding-detail-text current">${esc(f.currentText)}</div>
          </div>` : ''}
        ${f.proposedText ? `
          <div class="finding-detail" onclick="event.stopPropagation()">
            <div class="finding-detail-label">Proposed</div>
            <div class="finding-detail-text proposed">${esc(f.proposedText)}</div>
          </div>` : ''}
        <textarea class="comment-area" placeholder="Add a comment (optional)..." oninput="setComment('${f.id}', this.value)" onclick="event.stopPropagation()" onmousedown="event.stopPropagation()">${esc(comment)}</textarea>
        <div class="finding-actions">
          ${f.status === 'pending' ? `
            <button class="btn btn-approve" onclick="event.stopPropagation(); setStatus('${f.id}', 'approved')">Approve</button>
            <button class="btn btn-reject" onclick="event.stopPropagation(); setStatus('${f.id}', 'rejected')">Reject</button>
          ` : `
            <button class="btn" onclick="event.stopPropagation(); setStatus('${f.id}', 'pending')">Reset to Pending</button>
          `}
        </div>
      ` : ''}
    </div>`;
  }).join('');
}

function renderMarkdownLine(line) {
  if (/^#### (.+)/.test(line)) return `<h4>${esc(RegExp.$1)}</h4>`;
  if (/^### (.+)/.test(line)) return `<h3>${esc(RegExp.$1)}</h3>`;
  if (/^## (.+)/.test(line)) return `<h2>${esc(RegExp.$1)}</h2>`;
  if (/^# (.+)/.test(line)) return `<h1>${esc(RegExp.$1)}</h1>`;
  if (/^[-*] (.+)/.test(line)) return `<li>${inlineMarkdown(RegExp.$1)}</li>`;
  if (/^\d+\. (.+)/.test(line)) return `<li>${inlineMarkdown(RegExp.$1)}</li>`;
  if (line.trim() === '') return '<br>';
  return inlineMarkdown(line);
}

function inlineMarkdown(text) {
  let s = esc(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`(.+?)`/g, '<code>$1</code>');
  return s;
}

function selectFinding(id) {
  STATE.selectedId = STATE.selectedId === id ? null : id;
  updateAll();
}

function setStatusFilter(filter) {
  STATE.statusFilter = filter;
  STATE.selectedId = null;
  updateAll();
}

function setStatus(id, status) {
  const f = STATE.findings.find(x => x.id === id);
  if (f) f.status = status;
  updateAll();
  showToast(`${id} ${status}`);
}

function setComment(id, text) {
  STATE.comments[id] = text;
}

function updateAll() {
  renderStats();
  renderFilters();
  renderSpec();
  renderFindings();
  updatePromptPanel();
}

function updatePromptPanel() {
  const approved = STATE.findings.filter(f => f.status === 'approved');
  const panel = document.getElementById('prompt-panel');
  const countEl = document.getElementById('approved-count');

  countEl.textContent = approved.length;

  if (approved.length === 0) {
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');

  const prompt = generatePrompt(approved);
  document.getElementById('prompt-content').textContent = prompt;
}

function generatePrompt(approved) {
  const lines = [`Apply these changes to the spec at: ${SPEC_CONTENT.path}\n`];

  approved.forEach((f, i) => {
    lines.push(`${i + 1}. ${f.title}`);
    lines.push(`   Location: ${f.location}`);
    if (f.currentText && f.proposedText) {
      lines.push(`   Change: "${f.currentText}" → "${f.proposedText}"`);
    } else if (f.proposedText) {
      lines.push(`   Add: "${f.proposedText}"`);
    } else {
      lines.push(`   Issue: ${f.issue}`);
    }
    const comment = STATE.comments[f.id];
    if (comment) {
      lines.push(`   Note: ${comment}`);
    }
    lines.push('');
  });

  return lines.join('\n');
}

function copyPrompt() {
  const approved = STATE.findings.filter(f => f.status === 'approved');
  const prompt = generatePrompt(approved);
  navigator.clipboard.writeText(prompt).then(() => {
    showToast('Prompt copied to clipboard');
  }).catch(() => {
    const el = document.getElementById('prompt-content');
    const range = document.createRange();
    range.selectNodeContents(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    showToast('Select All applied — press Cmd/Ctrl+C');
  });
}

function downloadSpec() {
  const content = SPEC_CONTENT.content || '';
  let modified = content;

  const approved = STATE.findings.filter(f => f.status === 'approved' && f.currentText && f.proposedText);
  approved.forEach(f => {
    modified = modified.replace(f.currentText, f.proposedText);
  });

  const blob = new Blob([modified], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const baseName = (SPEC_CONTENT.path || 'spec').split('/').pop().replace(/\.md$/, '');
  a.download = `${baseName}.modified.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Modified spec downloaded');
}

function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function escapeAttr(str) {
  return esc(str).replace(/"/g, '&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('severity-filter').addEventListener('change', function() {
  STATE.severityFilter = this.value;
  STATE.selectedId = null;
  updateAll();
});

init();
</script>
